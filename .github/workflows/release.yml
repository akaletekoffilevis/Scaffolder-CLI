name: Build and Release

on:
  push:
    tags: ['v*']

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    strategy:
      max-parallel: 3
      matrix:
        rid:
          - linux-x64
          - linux-musl-x64
          - linux-arm64
          - win-x64
          - win-x86
          - osx-x64
          - osx-arm64
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-musl-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
          - rid: win-x86
            os: windows-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Scaffolder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Install cross-compilation tools (linux-arm64)
        if: matrix.rid == 'linux-arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools (linux-musl-x64)
        if: matrix.rid == 'linux-musl-x64'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Restore
        run: dotnet restore -r ${{ matrix.rid }}

      - name: Publish AOT (${{ matrix.rid }})
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained --no-restore

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd bin/Release/net9.0/${{ matrix.rid }}/publish
          tar -czf ../../../../../scaffold-${{ matrix.rid }}.tar.gz scaffold

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd bin/Release/net9.0/${{ matrix.rid }}/publish
          tar -czf ../../../../../scaffold-${{ matrix.rid }}.tar.gz scaffold.exe

      - uses: actions/upload-artifact@v4
        with:
          name: scaffold-${{ matrix.rid }}
          path: Scaffolder/scaffold-${{ matrix.rid }}.tar.gz

  release:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
